<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>24 Mason Street Sale Tracker</title>
<style>
body{margin:0;background:#f5f6f7;color:#18191a;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:1280px;margin:auto;padding:24px 18px 60px}.hero{background:#111;color:#fff;border-radius:18px;padding:24px;display:flex;justify-content:space-between;gap:20px}.hero h1{margin:6px 0;font-size:30px}.hero p{margin:0;color:#c7cad0}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:#a7abb1;font-weight:700}.price{text-align:right}.price strong{display:block;font-size:30px}
.stagebar{display:grid;grid-template-columns:repeat(9,1fr);gap:7px;margin:18px 0}.stage{background:#fff;border:1px solid #e2e4e7;border-radius:10px;padding:10px;min-height:68px}.done{background:#f2faf5!important}.current{background:#fff8ea!important}.stage b{font-size:11px;display:block}.stage small{color:#777}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.metric,.card{background:#fff;border:1px solid #e2e4e7;border-radius:14px}.metric{padding:14px}.metric .n{font-size:24px;font-weight:750}.metric .l{font-size:10px;color:#777;text-transform:uppercase;letter-spacing:.08em}.grid{display:grid;grid-template-columns:1.35fr .65fr;gap:18px}.card{padding:18px}.card h2{font-size:14px;margin:0 0 12px}
.task{display:grid;grid-template-columns:9px 1fr auto;gap:12px;padding:13px 0;border-top:1px solid #eef0f2}.task:first-of-type{border-top:0}.dot{width:9px;height:9px;border-radius:50%;margin-top:5px}.High{background:#d74c4c}.Medium{background:#d79a31}.Low{background:#6b8fbe}.task h3{font-size:13px;margin:0 0 4px}.task p{font-size:12px;color:#72767d;margin:0}.pill{font-size:10px;padding:5px 8px;border-radius:999px;background:#f1f2f4;border:1px solid #e1e3e6;white-space:nowrap;height:max-content}.blocked{background:#fff0f0;color:#a83838}.progress{background:#fff8e9;color:#8a6518}.complete{background:#eff9f3;color:#2a7045}
.event{padding:0 0 16px 19px;border-left:1px solid #e0e2e5;margin-left:5px;position:relative}.event:before{content:"";position:absolute;left:-5px;top:4px;width:9px;height:9px;background:#111;border-radius:50%}.event:last-child{border-left-color:transparent}.event time{font-size:10px;color:#8a8e94}.event h3{font-size:12px;margin:3px 0}.event p{font-size:11px;color:#72767d;margin:0}.people{display:grid;grid-template-columns:1fr 1fr;gap:9px}.person{border:1px solid #eceef0;border-radius:10px;padding:10px}.person b{font-size:12px}.person small{display:block;color:#777;margin-top:3px}.doc{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid #eef0f2;font-size:12px}.foot{margin-top:14px;font-size:10px;color:#8a8e94;text-align:right}
@media(max-width:900px){.grid{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}.stagebar{grid-template-columns:repeat(3,1fr)}.hero{flex-direction:column}.price{text-align:left}.people{grid-template-columns:1fr}}
</style>
</head>
<body><main class="wrap" id="app"><div class="card">Loading tracker…</div></main>
<script>
const BASE='https://likcbjwxpetobsoiytmt.supabase.co/rest/v1/';
const KEY='sb_publishable_sCZh7wCgfU4RwDqkC8TtuA_JGxA24Ah';
async function load(name,order=''){const u=new URL(BASE+name);u.searchParams.set('select','*');if(order)u.searchParams.set('order',order);const r=await fetch(u,{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});if(!r.ok)throw new Error(name+' '+r.status);return r.json()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function pill(s){const x=(s||'').toLowerCase();const c=x.includes('complete')?'complete':x.includes('blocked')?'blocked':(x.includes('progress')||x.includes('ready')||x.includes('waiting'))?'progress':'';return '<span class="pill '+c+'">'+esc(s||'—')+'</span>'}
(async()=>{try{
const [states,tasks,people,timeline,milestones,documents]=await Promise.all([load('sale_tracker_state'),load('tasks','sort_order.asc'),load('people','name.asc'),load('timeline_events','event_at.desc'),load('milestones','sequence.asc'),load('documents','name.asc')]);
const s=states[0]||{},open=tasks.filter(t=>!['Complete','Done'].includes(t.status)).length,blockers=tasks.filter(t=>t.blocker&&!['Complete','Done'].includes(t.status)).length,waiting=tasks.filter(t=>['Waiting','Blocked'].includes(t.status)).length,actions=timeline.filter(e=>e.action_required).length;
document.getElementById('app').innerHTML=
'<section class="hero"><div><div class="eyebrow">Property sale control centre</div><h1>24 Mason Street</h1><p>'+esc(s.property_address)+'</p><p style="margin-top:8px">Current stage: <b>'+esc(s.overall_stage)+'</b></p></div><div class="price"><span>Accepted offer</span><strong>£'+Number(s.sale_price_gbp||0).toLocaleString('en-GB')+'</strong><span>'+esc(s.buyer_summary)+'</span></div></section>'+
'<section class="stagebar">'+milestones.map(m=>'<div class="stage '+(m.status==='Complete'?'done':m.status==='In progress'?'current':'')+'"><b>'+esc(m.name)+'</b><small>'+esc(m.status)+'</small></div>').join('')+'</section>'+
'<section class="summary"><div class="metric"><div class="n">'+open+'</div><div class="l">Open items</div></div><div class="metric"><div class="n">'+blockers+'</div><div class="l">Blockers</div></div><div class="metric"><div class="n">'+waiting+'</div><div class="l">Waiting on others</div></div><div class="metric"><div class="n">'+actions+'</div><div class="l">Action events</div></div></section>'+
'<section class="grid"><div><div class="card"><h2>Open actions</h2>'+tasks.map(t=>'<div class="task"><span class="dot '+esc(t.priority)+'"></span><div><h3>'+esc(t.title)+'</h3><p>'+esc(t.description)+'</p><p style="margin-top:5px"><b>Owner:</b> '+esc(t.owner||'—')+(t.waiting_on?' · <b>Waiting on:</b> '+esc(t.waiting_on):'')+'</p></div>'+pill(t.status)+'</div>').join('')+'</div><div class="card" style="margin-top:18px"><h2>Timeline</h2>'+timeline.map(e=>'<div class="event"><time>'+new Date(e.event_at).toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short',timeZone:'Europe/London'})+'</time><h3>'+esc(e.title)+(e.actor?' — '+esc(e.actor):'')+'</h3><p>'+esc(e.summary)+'</p></div>').join('')+'</div></div><aside><div class="card"><h2>People</h2><div class="people">'+people.map(p=>'<div class="person"><b>'+esc(p.name)+'</b><small>'+esc((p.role||'')+(p.organisation?' · '+p.organisation:''))+'</small>'+(p.notes?'<small>'+esc(p.notes)+'</small>':'')+'</div>').join('')+'</div></div><div class="card" style="margin-top:18px"><h2>Documents</h2>'+documents.map(d=>'<div class="doc"><div><b>'+esc(d.name)+'</b><div style="color:#777">'+esc(d.holder||'—')+'</div></div>'+pill(d.status)+'</div>').join('')+'</div></aside></section><div class="foot">Live data from the dedicated 24 Mason Street Supabase project</div>';
}catch(e){document.getElementById('app').innerHTML='<div class="card">Could not load tracker: '+esc(e.message)+'</div>'}})();
</script><!-- redeploy static -->
</body></html>
