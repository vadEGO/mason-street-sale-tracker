<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>24 Mason Street Sale Tracker</title>
<style>
body{margin:0;background:#f5f6f7;color:#18191a;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:1380px;margin:auto;padding:24px 18px 60px}.hero{background:#111;color:#fff;border-radius:18px;padding:24px;display:flex;justify-content:space-between;gap:20px}.hero h1{margin:6px 0;font-size:30px}.hero p{margin:0;color:#c7cad0}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:#a7abb1;font-weight:700}.price{text-align:right}.price strong{display:block;font-size:30px}
.stagebar{display:grid;grid-template-columns:repeat(9,1fr);gap:7px;margin:18px 0}.stage{background:#fff;border:1px solid #e2e4e7;border-radius:10px;padding:10px;min-height:68px}.doneStage{background:#f2faf5}.currentStage{background:#fff8ea}.stage b{font-size:11px;display:block}.stage small{color:#777}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.metric,.card{background:#fff;border:1px solid #e2e4e7;border-radius:14px}.metric{padding:14px}.metric .n{font-size:24px;font-weight:750}.metric .l{font-size:10px;color:#777;text-transform:uppercase;letter-spacing:.08em}
.kanban{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start}.lane{background:#eef0f2;border-radius:14px;padding:12px;min-height:260px}.lane h2{font-size:12px;margin:2px 4px 10px;text-transform:uppercase;letter-spacing:.08em;color:#62666d}.count{float:right;background:#fff;border:1px solid #dfe2e5;border-radius:999px;padding:2px 7px;font-size:10px}
.kcard{background:#fff;border:1px solid #e2e4e7;border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.03)}.kcard:last-child{margin-bottom:0}.kcard .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.kcard h3{font-size:13px;margin:0;line-height:1.3}.kcard p{font-size:11px;color:#72767d;margin:6px 0 0;line-height:1.4}.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.chip{font-size:10px;padding:4px 7px;border-radius:999px;background:#f3f4f5;border:1px solid #e2e4e7}.due{background:#fff7e7;border-color:#ecd5a5}.prioHigh{background:#fff0f0;color:#a63838}.prioMedium{background:#fff8ea;color:#8a6518}.prioLow{background:#eef4fb;color:#466e9d}.blocked{background:#fff0f0;color:#a63838}.done{background:#eef8f2;color:#2e7148}
.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;margin-top:18px}.card{padding:18px}.card h2{font-size:14px;margin:0 0 12px}.event{padding:0 0 16px 19px;border-left:1px solid #e0e2e5;margin-left:5px;position:relative}.event:before{content:"";position:absolute;left:-5px;top:4px;width:9px;height:9px;background:#111;border-radius:50%}.event:last-child{border-left-color:transparent}.event time{font-size:10px;color:#8a8e94}.event h3{font-size:12px;margin:3px 0}.event p{font-size:11px;color:#72767d;margin:0}.people{display:grid;grid-template-columns:1fr 1fr;gap:9px}.person{border:1px solid #eceef0;border-radius:10px;padding:10px}.person b{font-size:12px}.person small{display:block;color:#777;margin-top:3px}.doc{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid #eef0f2;font-size:12px}.foot{margin-top:14px;font-size:10px;color:#8a8e94;text-align:right}
@media(max-width:1050px){.kanban{grid-template-columns:1fr 1fr}.stagebar{grid-template-columns:repeat(3,1fr)}}
@media(max-width:800px){.grid{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}.hero{flex-direction:column}.price{text-align:left}.people{grid-template-columns:1fr}}
@media(max-width:600px){.kanban{grid-template-columns:1fr}.wrap{padding:12px}.stagebar{grid-template-columns:1fr 1fr}}
</style>
</head>
<body><main class="wrap" id="app"><div class="card">Loading tracker…</div></main>
<script>
const BASE='https://likcbjwxpetobsoiytmt.supabase.co/rest/v1/';
const KEY='sb_publishable_sCZh7wCgfU4RwDqkC8TtuA_JGxA24Ah';
async function load(name,order=''){const u=new URL(BASE+name);u.searchParams.set('select','*');if(order)u.searchParams.set('order',order);const r=await fetch(u,{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});if(!r.ok)throw new Error(name+' '+r.status);return r.json()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function fmtDate(v){if(!v)return 'No date';const d=new Date(v+'T12:00:00');return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}
function priorityClass(p){return p==='High'?'prioHigh':p==='Low'?'prioLow':'prioMedium'}
function card(t){return '<div class="kcard"><div class="top"><h3>'+esc(t.title)+'</h3><span class="chip '+priorityClass(t.priority)+'">'+esc(t.priority)+'</span></div><p>'+esc(t.description||'')+'</p><div class="meta"><span class="chip due">'+fmtDate(t.due_date)+'</span><span class="chip">'+esc(t.owner||'—')+'</span>'+(t.waiting_on?'<span class="chip blocked">Waiting: '+esc(t.waiting_on)+'</span>':'')+'</div></div>'}
(async()=>{try{
const [states,tasks,people,timeline,milestones,documents]=await Promise.all([load('sale_tracker_state'),load('tasks','sort_order.asc'),load('people','name.asc'),load('timeline_events','event_at.desc'),load('milestones','sequence.asc'),load('documents','name.asc')]);
const s=states[0]||{};
const open=tasks.filter(t=>!['Complete','Done'].includes(t.status)).length,blockers=tasks.filter(t=>t.blocker&&!['Complete','Done'].includes(t.status)).length,waiting=tasks.filter(t=>['Waiting','Blocked'].includes(t.status)).length,doneCount=tasks.filter(t=>['Complete','Done'].includes(t.status)).length;
const thisWeek=tasks.filter(t=>!['Complete','Done','Blocked','Waiting'].includes(t.status)&&t.due_date&&t.due_date<='2026-10-11');
const waitingTasks=tasks.filter(t=>['Blocked','Waiting'].includes(t.status));
const later=tasks.filter(t=>!['Complete','Done','Blocked','Waiting'].includes(t.status)&&(!t.due_date||t.due_date>'2026-10-11'));
const doneTasks=tasks.filter(t=>['Complete','Done'].includes(t.status));
document.getElementById('app').innerHTML=
'<section class="hero"><div><div class="eyebrow">Property sale control centre</div><h1>24 Mason Street</h1><p>'+esc(s.property_address)+'</p><p style="margin-top:8px">Current stage: <b>'+esc(s.overall_stage)+'</b></p></div><div class="price"><span>Accepted offer</span><strong>£'+Number(s.sale_price_gbp||0).toLocaleString('en-GB')+'</strong><span>'+esc(s.buyer_summary)+'</span></div></section>'+
'<section class="stagebar">'+milestones.map(m=>'<div class="stage '+(m.status==='Complete'?'doneStage':m.status==='In progress'?'currentStage':'')+'"><b>'+esc(m.name)+'</b><small>'+esc(m.status)+'</small></div>').join('')+'</section>'+
'<section class="summary"><div class="metric"><div class="n">'+open+'</div><div class="l">Open items</div></div><div class="metric"><div class="n">'+blockers+'</div><div class="l">Blockers</div></div><div class="metric"><div class="n">'+waiting+'</div><div class="l">Waiting</div></div><div class="metric"><div class="n">'+doneCount+'</div><div class="l">Done</div></div></section>'+
'<section class="kanban">'+
'<div class="lane"><h2>This week <span class="count">'+thisWeek.length+'</span></h2>'+thisWeek.map(card).join('')+'</div>'+
'<div class="lane"><h2>Waiting / blocked <span class="count">'+waitingTasks.length+'</span></h2>'+waitingTasks.map(card).join('')+'</div>'+
'<div class="lane"><h2>Later <span class="count">'+later.length+'</span></h2>'+later.map(card).join('')+'</div>'+
'<div class="lane"><h2>Done <span class="count">'+doneTasks.length+'</span></h2>'+doneTasks.map(card).join('')+'</div>'+
'</section>'+
'<section class="grid"><div class="card"><h2>Timeline</h2>'+timeline.slice(0,8).map(e=>'<div class="event"><time>'+new Date(e.event_at).toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short',timeZone:'Europe/London'})+'</time><h3>'+esc(e.title)+(e.actor?' — '+esc(e.actor):'')+'</h3><p>'+esc(e.summary)+'</p></div>').join('')+'</div><aside><div class="card"><h2>People</h2><div class="people">'+people.map(p=>'<div class="person"><b>'+esc(p.name)+'</b><small>'+esc((p.role||'')+(p.organisation?' · '+p.organisation:''))+'</small>'+(p.notes?'<small>'+esc(p.notes)+'</small>':'')+'</div>').join('')+'</div></div><div class="card" style="margin-top:18px"><h2>Documents</h2>'+documents.map(d=>'<div class="doc"><div><b>'+esc(d.name)+'</b><div style="color:#777">'+esc(d.holder||'—')+'</div></div><span class="chip">'+esc(d.status)+'</span></div>').join('')+'</div></aside></section>'+
'<div class="foot">Live data from the dedicated 24 Mason Street Supabase project</div>';
}catch(e){document.getElementById('app').innerHTML='<div class="card">Could not load tracker: '+esc(e.message)+'</div>'}})();
</script>
</body></html>
